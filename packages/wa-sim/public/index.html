<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp simulator</title>
<style>
  :root { --bg: #efeae2; --me: #d9fdd3; --them: #ffffff; --bar: #075e54; --text: #111b21; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #ccc; color: var(--text); display: flex; justify-content: center; }
  .phone { width: 100%; max-width: 400px; height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
  header { background: var(--bar); color: #fff; padding: 12px 16px; display: flex; gap: 8px; align-items: center; }
  header input { width: 140px; padding: 4px 6px; border: 0; border-radius: 4px; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 80%; padding: 6px 10px; border-radius: 8px; white-space: pre-wrap; box-shadow: 0 1px 1px rgba(0,0,0,.1); }
  .me { align-self: flex-end; background: var(--me); }
  .sys { align-self: center; font-size: 12px; color: #54656f; background: #fff8; }
  form { display: flex; gap: 8px; padding: 8px; background: #f0f2f5; }
  form input { flex: 1; padding: 10px 12px; border: 0; border-radius: 20px; }
  form button { border: 0; border-radius: 20px; padding: 0 16px; background: var(--bar); color: #fff; }
</style>
</head>
<body>
<div class="phone">
  <header>
    <strong>Sim</strong>
    <label>From <input id="from" value="27820000482" inputmode="numeric"></label>
  </header>
  <div id="chat"><div class="msg sys">Simulator shell. Replies from the bot appear here from M1.</div></div>
  <form id="f">
    <input id="text" placeholder="Type, e.g. PAY AB12CD" autocomplete="off">
    <button>Send</button>
  </form>
</div>
<script>
  const chat = document.getElementById("chat");
  const add = (text, cls) => { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; };
  // Opening the simulator with ?text=PAY%20XYZ mimics a wa.me deep link with prefilled text.
  const pre = new URLSearchParams(location.search).get("text");
  if (pre) document.getElementById("text").value = pre;
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("text");
    const text = input.value.trim();
    if (!text) return;
    add(text, "me");
    input.value = "";
    try {
      const r = await fetch("/send", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ from: document.getElementById("from").value, name: "Sim User", text }) });
      const j = await r.json();
      if (j.apiStatus !== 200) add("API answered " + (j.apiStatus ?? j.error), "sys");
    } catch { add("Simulator could not reach the API", "sys"); }
  });
</script>
</body>
</html>
