# Default gitleaks rules, minus files that hold deliberate dev-only placeholders.
[extend]
useDefault = true

[allowlist]
description = "dev placeholders and test fixtures"
paths = [
  '''^\.env\.example$''',
  '''^packages/testkit/src/index\.ts$''',
  '''(^|/)test/.*\.test\.ts$''',
  # Browser-test stack settings (apps/web/e2e/env.ts): fake values for a throwaway local database.
  '''^apps/web/e2e/''',
]
