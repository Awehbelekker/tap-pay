name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tappay
          POSTGRES_PASSWORD: tappay
          POSTGRES_DB: tappay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tappay" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://tappay:tappay@localhost:5432/tappay_test
      TZ: Africa/Johannesburg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI types are up to date
        run: pnpm gen:api && git diff --exit-code packages/core/src/generated/api.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @tappay/web build
      - name: Dependency audit (high and above fails)
        run: pnpm audit --audit-level high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the gitleaks binary over the full history. (gitleaks-action scans only the pushed
      # range and fails when that range starts at the root commit.)
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --redact -v --exit-code 1 .
